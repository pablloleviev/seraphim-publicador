name: Biblioteca de trilhas
on:
  workflow_dispatch: {}
  push:
    paths: ["musica/fontes.json"]
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q numpy
          python scripts/baixar_musicas.py 2>&1 | tee musica/log.txt
      - run: |
          git config user.name "seraphim-bot"; git config user.email "bot@users.noreply.github.com"
          git add musica; git commit -qm "biblioteca de trilhas" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push && exit 0; sleep 5; done
