name: Testar chave do Instagram
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/ig_teste.py
      - run: |
          git config user.name "seraphim-bot"; git config user.email "bot@users.noreply.github.com"
          git add ig_teste_log.txt; git commit -qm "teste da chave do Instagram" || exit 0
          git pull -q --rebase -X theirs; git push
