name: Criar cenário
on:
  workflow_dispatch:
    inputs:
      descricao: {description: "Descreva o lugar", required: true}
permissions:
  contents: write
jobs:
  criar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python3 scripts/gerar_cenario.py "${{ github.event.inputs.descricao }}"
      - run: |
          git config user.name "seraphim-bot"; git config user.email "bot@users.noreply.github.com"
          git add cenarios && git commit -m "cenário novo" && git pull --rebase -q && git push
