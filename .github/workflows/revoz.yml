name: Refazer voz (Gemini)
on:
  schedule:
    - cron: "40 8 * * *"   # 05:40 em Brasília, logo após a cota do Gemini renovar
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: gerar-video
  cancel-in-progress: false
jobs:
  revoz:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: motor/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: .github/workflows/gerar-video.yml}
      - run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q edge-tts faster-whisper
          cd motor && npm ci --no-audit --no-fund
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/revoz.py
      - run: |
          git config user.name "seraphim-bot"; git config user.email "bot@users.noreply.github.com"
          for p in fila revoz; do git add -A -- "$p" 2>/dev/null || true; done
          git diff --cached --quiet && exit 0
          git commit -q -m "voz refeita com Gemini"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep 5; done; exit 1
