name: Narração por linhas (vídeos AutoFlow)
on:
  push:
    paths: ["voz_pedidos/**"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: voz-linhas
  cancel-in-progress: false
jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q edge-tts faster-whisper soundfile numpy
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_VOZ: Puck
        run: python scripts/voz_linhas.py
      - run: |
          git config user.name "seraphim-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A -- voz_saida 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "narração gerada (voz_linhas)"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep 5; done; exit 1
