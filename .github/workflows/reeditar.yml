name: Reeditar fila (tema visual)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  reeditar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        parte: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: motor/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: .github/workflows/gerar-video.yml}
      - run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q edge-tts faster-whisper
          cd motor && npm ci --no-audit --no-fund
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/reeditar.py ${{ matrix.parte }} 6
      - run: |
          git config user.name "seraphim-bot"; git config user.email "bot@users.noreply.github.com"
          for p in fila revoz; do git add -A -- "$p" 2>/dev/null || true; done
          git reset -q -- 'revoz/*.mp4' 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "edição refeita com tema visual (parte ${{ matrix.parte }})"
          for i in 1 2 3 4 5 6 7 8; do git pull -q --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep $((RANDOM % 15 + 5)); done; exit 1
