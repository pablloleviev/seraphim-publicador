name: Teste fontes de música
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          (
          echo "== pixabay page"; curl -sS -A "Mozilla/5.0" -o p.html -w "%{http_code}\n" "https://pixabay.com/music/search/epic%20cinematic/"; grep -o 'https://cdn.pixabay.com/[^"]*\.mp3' p.html | head -3
          echo "== pixabay api music"; curl -sS -o /dev/null -w "%{http_code}\n" "https://pixabay.com/api/?key=${{ secrets.PIXABAY_API_KEY }}&q=epic&media_type=music"
          echo "== ccmixter"; curl -sS "http://ccmixter.org/api/query?f=json&tags=cinematic&limit=2&lic=by" | head -c 600; echo
          echo "== archive.org"; curl -sS "https://archive.org/advancedsearch.php?q=collection%3A%28freemusicarchive%29+AND+subject%3A%28cinematic%29&fl%5B%5D=identifier&rows=3&output=json" | head -c 400; echo
          echo "== incompetech"; curl -sS -o /dev/null -w "%{http_code}\n" "https://incompetech.com/music/royalty-free/pieces.json"
          ) 2>&1 | tee musica_log.txt
      - run: |
          git config user.name "seraphim-bot"; git config user.email "bot@users.noreply.github.com"
          git add musica_log.txt; git commit -qm "teste música" || exit 0; git pull -q --rebase -X theirs; git push
