name: Prévia de vídeo (motor estilo)
on:
  workflow_dispatch:
    inputs:
      spec: {description: "arquivo em previas/", required: true, default: "previas/estilo-previa.json"}
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: motor/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q edge-tts faster-whisper soundfile numpy
          cd motor && npm ci --no-audit --no-fund
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          n=$(basename "${{ inputs.spec }}" .json)
          python scripts/fazer_video.py "${{ inputs.spec }}" --voz gemini --saida "previas/$n.mp4" 2>&1 | tee previas/$n.log
      - if: always()
        run: |
          git config user.name "seraphim-bot"; git config user.email "bot@users.noreply.github.com"
          git add previas; git commit -qm "prévia de vídeo" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && exit 0; sleep 5; done
