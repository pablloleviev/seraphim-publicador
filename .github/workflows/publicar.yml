name: Publicador Seraphim

on:
  schedule:
    - cron: "*/15 * * * *"   # a cada 15 minutos (horário UTC)
  workflow_dispatch: {}       # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: publicador
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar Telegram e publicar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/publicar.py
      - name: Salvar estado
        if: always()
        run: |
          git config user.name "seraphim-bot"
          git config user.email "bot@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet || (git commit -m "estado: atualização automática" && git push)
