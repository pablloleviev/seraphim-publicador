name: Publicador Seraphim

on:
  schedule:
    - cron: "5 * * * *"      # de hora em hora; cada execução fica ~50 min ouvindo o Telegram
  workflow_dispatch: {}       # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: publicador
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar Telegram e publicar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: |
          pip install -q cryptography
          set -o pipefail; python scripts/publicar.py 2>&1 | tee publicar_log.txt
      - name: Salvar estado
        if: always()
        run: |
          git config user.name "seraphim-bot"
          git config user.email "bot@users.noreply.github.com"
          git add estado.json publicar_log.txt tiktok_token.enc 2>/dev/null || git add estado.json publicar_log.txt
          git diff --cached --quiet || (git commit -m "estado: atualização automática" && (git pull --rebase -q; git push))
