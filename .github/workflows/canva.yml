name: Canva (API direta, sem Claude)
on:
  workflow_dispatch:
    inputs:
      acao: {description: "conectar | teste", required: true, default: "teste"}
      code: {description: "código do login (só no conectar)", required: false}
      verifier: {description: "verificador PKCE (só no conectar)", required: false}
permissions:
  contents: write
jobs:
  canva:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_REFRESH: ${{ secrets.CANVA_REFRESH }}
          GH_PAT: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          if [ "${{ inputs.acao }}" = "pat" ]; then GH_TOKEN="$GH_PAT" gh secret set TESTE_PAT --body ok --repo "$GITHUB_REPOSITORY" 2>&1 | tee canva_log.txt; echo "pat: ${PIPESTATUS[0]}" >> canva_log.txt; exit 0; fi
          if [ "${{ inputs.acao }}" = "preencher" ]; then mkdir -p testes/canva; python scripts/canva_api.py preencher EAHYRzne2Zw '{"rotulo":"TESTE AUTOMÁTICO","titulo":"Feito pelo GitHub, sem Claude","subtitulo":"Modelo do Canva preenchido pela API."}' testes/canva/capa_teste.png 2>&1 | tee canva_log.txt; exit ${PIPESTATUS[0]}; fi
          if [ "${{ inputs.acao }}" = "conectar" ]; then python scripts/canva_api.py conectar "${{ inputs.code }}" "${{ inputs.verifier }}"; else python scripts/canva_api.py teste; fi 2>&1 | tee canva_log.txt; exit ${PIPESTATUS[0]}
      - if: always()
        run: |
          git config user.name "seraphim-bot"; git config user.email "bot@users.noreply.github.com"
          git add canva_log.txt testes/canva 2>/dev/null; git commit -qm "canva: log" || exit 0
          git pull -q --rebase -X theirs; git push -q
