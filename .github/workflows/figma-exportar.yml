name: Figma — exportar capas para a fila
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pillow
      - env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: python scripts/figma_exportar.py
      - run: |
          git config user.name "seraphim-bot"; git config user.email "bot@users.noreply.github.com"
          git add fila; git commit -qm "capas do Figma na fila" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && exit 0; sleep 5; done
