name: TikTok - conectar conta (1 vez)
on:
  workflow_dispatch:
    inputs:
      code: {description: "código do login do TikTok", required: true}
permissions:
  contents: write
jobs:
  conectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: |
          pip install -q cryptography
          python scripts/tiktok.py autorizar "${{ github.event.inputs.code }}"
      - run: |
          git config user.name "seraphim-bot"; git config user.email "bot@users.noreply.github.com"
          git add tiktok_token.enc && git commit -m "TikTok conectado" && git pull --rebase -q && git push
