name: Buffer - teste
on:
  workflow_dispatch:
    inputs:
      acao: {description: "canais ou teste", required: true, default: "canais"}
      pasta: {description: "fila/<pasta> (só no teste)", required: false, default: ""}
permissions:
  contents: write
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
        run: python scripts/buffer.py "${{ github.event.inputs.acao }}" ${{ github.event.inputs.pasta }} 2>&1 | tee buffer_log.txt
      - if: always()
        run: |
          git config user.name "seraphim-bot"; git config user.email "bot@users.noreply.github.com"
          git add buffer_log.txt; git commit -qm "buffer: log do teste" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push && exit 0; sleep 5; done
