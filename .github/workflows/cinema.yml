name: Cinema (gravação -> plano cinematográfico)

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # olha a pasta do Drive a cada 15 min
  push:
    paths: ["gravacoes/**.json"]
  workflow_dispatch:
    inputs:
      video_url: {description: "URL de um vídeo de teste", required: false}
      cenario_url: {description: "URL de uma imagem de cenário", required: false}

permissions:
  contents: write

concurrency:
  group: cinema
  cancel-in-progress: false

jobs:
  cinema:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Buscar vídeos novos no Drive
        id: drive
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python3 scripts/buscar_drive.py
      - uses: actions/setup-node@v4
        if: ${{ (github.event_name != 'schedule' || steps.drive.outputs.novos != '0') }}
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motor/package-lock.json
      - uses: actions/setup-python@v5
        if: ${{ (github.event_name != 'schedule' || steps.drive.outputs.novos != '0') }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/cinema.yml
      - name: Instalar
        if: ${{ (github.event_name != 'schedule' || steps.drive.outputs.novos != '0') }}
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -q opencv-python-headless numpy faster-whisper
          python -c "
          import json,os,urllib.request
          for n,u in json.load(open('cenarios/lista.json')).items():
              d=f'cenarios/{n}.jpg'
              if not os.path.exists(d):
                  r=urllib.request.Request(u+'?auto=compress&w=2160',headers={'User-Agent':'Mozilla/5.0'})
                  open(d,'wb').write(urllib.request.urlopen(r).read()); print('cenario',d)
          "
          cd motor && npm ci --no-audit --no-fund
      - name: Teste com URLs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        if: ${{ github.event.inputs.video_url != '' }}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          mkdir -p /tmp/t amostras/cinema
          curl -sSL -A "$UA" -o /tmp/t/in.mp4 "${{ github.event.inputs.video_url }}"
          curl -sSL -A "$UA" -o /tmp/t/bg.jpg "${{ github.event.inputs.cenario_url }}"
          ffprobe -v error -show_entries format=duration:stream=width,height -of csv=p=0 /tmp/t/in.mp4
          ffmpeg -v error -y -i /tmp/t/in.mp4 -t 12 -c copy /tmp/t/in12.mp4
          mkdir -p gravacoes cenarios
          if ! ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 /tmp/t/in12.mp4 | grep -q .; then
            echo "clipe sem som: colocando narração de teste (Gemini)"
            pip install -q edge-tts
            python -c "
          import sys; sys.path.insert(0,'scripts'); import fazer_video as f
          f.voz_gemini('Sua oficina pode estar perdendo dinheiro agora mesmo. E o pior: você nem percebe. Primeiro: você cobra no achômetro.', '/tmp/t/voz.mp3')
          "
            ffmpeg -v error -y -i /tmp/t/in12.mp4 -i /tmp/t/voz.mp3 -map 0:v -map 1:a -c:v copy -c:a aac -shortest /tmp/t/com_som.mp4 && mv /tmp/t/com_som.mp4 /tmp/t/in12.mp4
          fi
          cp /tmp/t/in12.mp4 gravacoes/teste.mp4; cp /tmp/t/bg.jpg cenarios/teste.jpg
          echo '{"nome":"cinema","video":"gravacoes/teste.mp4","cenario":"cenarios/teste.jpg","amostra":true,"titulo":["SUA OFICINA","ESTÁ *PERDENDO*","*DINHEIRO?*"],"insercoes":[{"inicio":6,"fim":8.5,"modelo":"numero","numero":"01","linhas":["COBRA NO","*ACHÔMETRO*"]}]}' > gravacoes/teste.json
          ffmpeg -v error -y -i /tmp/t/in12.mp4 -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" -an amostras/cinema/original.mp4
          python scripts/fazer_gravacao.py 2>&1 | tee amostras/cinema/log.txt
          rm -f cenarios/teste.jpg
      - name: Processar gravações enviadas
        if: ${{ github.event.inputs.video_url == '' && (github.event_name != 'schedule' || steps.drive.outputs.novos != '0') }}
        run: python scripts/fazer_gravacao.py
      - name: Salvar
        run: |
          git config user.name "seraphim-bot"
          git config user.email "bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --soft origin/main
            git add -A .
            git diff --cached --quiet && exit 0
            git commit -q -m "cinema: resultado"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
