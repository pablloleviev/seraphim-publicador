name: Cinema (gravação -> plano cinematográfico)

on:
  push:
    paths: ["gravacoes/**.json"]
  workflow_dispatch:
    inputs:
      video_url: {description: "URL de um vídeo de teste", required: false}
      cenario_url: {description: "URL de uma imagem de cenário", required: false}

permissions:
  contents: write

concurrency:
  group: cinema
  cancel-in-progress: false

jobs:
  cinema:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motor/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/cinema.yml
      - name: Instalar
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -q opencv-python-headless numpy faster-whisper
          cd motor && npm ci --no-audit --no-fund
      - name: Teste com URLs
        if: ${{ github.event.inputs.video_url != '' }}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          mkdir -p /tmp/t amostras/cinema
          curl -sSL -A "$UA" -o /tmp/t/in.mp4 "${{ github.event.inputs.video_url }}"
          curl -sSL -A "$UA" -o /tmp/t/bg.jpg "${{ github.event.inputs.cenario_url }}"
          ffprobe -v error -show_entries format=duration:stream=width,height -of csv=p=0 /tmp/t/in.mp4
          ffmpeg -v error -y -i /tmp/t/in.mp4 -t 12 -c copy /tmp/t/in12.mp4
          mkdir -p gravacoes cenarios
          cp /tmp/t/in12.mp4 gravacoes/teste.mp4; cp /tmp/t/bg.jpg cenarios/teste.jpg
          echo '{"nome":"cinema","video":"gravacoes/teste.mp4","cenario":"cenarios/teste.jpg","amostra":true,"titulo":["SUA OFICINA","ESTÁ *PERDENDO*","*DINHEIRO?*"],"insercoes":[{"inicio":6,"fim":8.5,"modelo":"numero","numero":"01","linhas":["COBRA NO","*ACHÔMETRO*"]}]}' > gravacoes/teste.json
          ffmpeg -v error -y -i /tmp/t/in12.mp4 -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" -an amostras/cinema/original.mp4
          python scripts/fazer_gravacao.py 2>&1 | tee amostras/cinema/log.txt
          rm -f cenarios/teste.jpg
      - name: Processar gravações enviadas
        if: ${{ github.event.inputs.video_url == '' }}
        run: python scripts/fazer_gravacao.py
      - name: Salvar
        run: |
          git config user.name "seraphim-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p amostras; git add -A amostras fila gravacoes 2>/dev/null || git add -A amostras
          git diff --cached --quiet && exit 0
          git commit -m "cinema: resultado"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push && exit 0; sleep 5; done; exit 1
