name: Gerar vídeos

on:
  push:
    paths: ["pedidos/*.json"]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: gerar-video
  cancel-in-progress: false

jobs:
  listar:
    runs-on: ubuntu-latest
    outputs:
      pedidos: ${{ steps.l.outputs.pedidos }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: |
          echo "pedidos=$(ls pedidos/*.json 2>/dev/null | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')" >> "$GITHUB_OUTPUT"

  gerar:
    needs: listar
    if: needs.listar.outputs.pedidos != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 10          # até 10 vídeos ao mesmo tempo (GitHub grátis em repositório público)
      matrix:
        pedido: ${{ fromJSON(needs.listar.outputs.pedidos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motor/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/gerar-video.yml
      - name: Instalar ferramentas
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q edge-tts faster-whisper kokoro-onnx soundfile
          cd motor && npm ci --no-audit --no-fund
      - name: Fazer vídeo
        env:
          PEDIDO: ${{ matrix.pedido }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/gerar_videos.py
      - name: Salvar na fila
        run: |
          git config user.name "seraphim-bot"
          git config user.email "bot@users.noreply.github.com"
          # só os arquivos que ESTE job mudou (cada vídeo tem pasta e arquivos próprios: jobs em paralelo não brigam)
          for p in fila pedidos gravacoes amostras cenarios revoz imagens_usadas; do git add -A -- "$p" 2>/dev/null || true; done
          git diff --cached --quiet && exit 0
          git commit -q -m "vídeo gerado: $(basename ${{ matrix.pedido }} .json)"
          for i in $(seq 1 12); do
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0
            sleep $((RANDOM % 10 + 3))
          done
          exit 1

  avisar:
    needs: gerar
    if: always() && needs.gerar.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar.yml -R ${{ github.repository }} || true
