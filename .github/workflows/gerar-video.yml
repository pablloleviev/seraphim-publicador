name: Gerar vídeos

on:
  push:
    paths: ["pedidos/*.json"]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: gerar-video
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motor/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/gerar-video.yml
      - name: Instalar ferramentas
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q edge-tts faster-whisper
          cd motor && npm ci --no-audit --no-fund
      - name: Fazer vídeos
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/gerar_videos.py
      - name: Salvar na fila
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "seraphim-bot"
          git config user.email "bot@users.noreply.github.com"
          # só os arquivos que ESTE job mudou (nunca apaga o que outros publicaram no meio tempo)
          for p in fila pedidos gravacoes amostras cenarios estado_drive.json; do git add -A -- "$p" 2>/dev/null || true; done
          git diff --cached --quiet && exit 0
          git commit -q -m "vídeo gerado e colocado na fila"
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin main && git push origin HEAD:main && { gh workflow run publicar.yml -R ${{ github.repository }} || true; exit 0; }
            sleep 5
          done
          exit 1
