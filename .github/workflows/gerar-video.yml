name: Gerar vídeos

on:
  push:
    paths: ["pedidos/*.json"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gerar-video
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motor/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji
          pip install -q edge-tts
          cd motor && npm ci --no-audit --no-fund
      - name: Fazer vídeos
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: python scripts/gerar_videos.py
      - name: Salvar na fila
        run: |
          git config user.name "seraphim-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A fila pedidos
          git diff --cached --quiet && exit 0
          git commit -m "vídeo gerado e colocado na fila"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
