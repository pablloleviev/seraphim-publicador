name: Relançamento — renderizar peça
on:
  workflow_dispatch:
    inputs:
      peca: {description: "pasta em relancamento/ (ex.: V1)", required: true}
      voz: {description: "gemini | edge", required: false, default: "gemini"}
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: motor/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Instalar
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q edge-tts faster-whisper kokoro-onnx soundfile numpy
          cd motor && npm ci --no-audit --no-fund
      - name: Renderizar (não publica nada)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python scripts/fazer_video.py relancamento/${{ inputs.peca }}/roteiro.json --voz ${{ inputs.voz }} --saida relancamento/${{ inputs.peca }}/video.mp4 2>&1 | tee relancamento/${{ inputs.peca }}/log.txt
      - run: |
          git config user.name "seraphim-bot"; git config user.email "bot@users.noreply.github.com"
          git add relancamento/${{ inputs.peca }}; git commit -qm "relançamento: ${{ inputs.peca }} renderizado" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && exit 0; sleep 5; done
