name: Teste ingredientes (fotos, IA, capas)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          pip install -q playwright pillow
          python -m playwright install --with-deps chromium
      - name: Testar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python scripts/ingredientes.py teste 2>&1 | tee testes/ingredientes/log.txt || true
          python scripts/amostra_capas.py || true
      - run: |
          git config user.name "seraphim-bot"; git config user.email "bot@users.noreply.github.com"
          git add testes/ingredientes imagens_usadas; git commit -m "teste ingredientes" || true
          git pull --rebase -X theirs || true; git push
